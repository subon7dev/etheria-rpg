[versions]
agp = "8.3.2"
kotlin = "1.9.24"
libgdx = "1.12.1"
minSdk = "26"
targetSdk = "35"
compileSdk = "35"

[libraries]
libgdx-core = { group = "com.badlogicgames.gdx", name = "gdx", version.ref = "libgdx" }
libgdx-android = { group = "com.badlogicgames.gdx", name = "gdx-backend-android", version.ref = "libgdx" }
libgdx-box2d-core = { group = "com.badlogicgames.gdx", name = "gdx-box2d", version.ref = "libgdx" }
libgdx-freetype-core = { group = "com.badlogicgames.gdx", name = "gdx-freetype", version.ref = "libgdx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
