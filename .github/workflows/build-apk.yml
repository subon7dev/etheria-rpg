name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install SDK 35
        run: |
          SDKMGR=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/release.keystore \
            -alias etheria \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass etheria123 \
            -keypass etheria123 \
            -dname "CN=Etheria, OU=Game, O=EtheriaRPG, L=Unknown, S=Unknown, C=US"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Rename and collect APKs
        run: |
          mkdir -p dist-apks
          cp android/build/outputs/apk/debug/*.apk dist-apks/etheria-debug.apk
          cp android/build/outputs/apk/release/*.apk dist-apks/etheria-release.apk
          ls -lh dist-apks/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: etheria-debug-apk
          path: dist-apks/etheria-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: etheria-release-apk
          path: dist-apks/etheria-release.apk
